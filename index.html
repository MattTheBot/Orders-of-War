<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders of War</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Standard CDN loads - Bulletproof for GitHub Pages and Local Testing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-overlay">
        <div id="panel">
            <h1>ORDERS OF WAR</h1>
            <p class="subtitle">Municipal & Town Layer Prototype</p>
            
            <div class="control-group">
                <button id="btn-regenerate">Regenerate Vienna Basin</button>
            </div>

            <div class="control-group">
                <label>Camera Layer Constraint:</label>
                <div id="layer-display">Municipal Layer (Strategic)</div>
            </div>

            <div id="status-text">
                Scroll to zoom in and transition to the Town Layer.
            </div>
            
            <div class="legend">
                <p><span style="color:#bae1ff">■</span> Friendly Forces (Blue)</p>
                <p><span style="color:#ffb3ba">■</span> Enemy Forces (Red)</p>
                <p><span style="color:#baffc9">■</span> Neutral / Infantry (Green)</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
